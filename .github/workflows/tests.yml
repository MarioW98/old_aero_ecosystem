name: Tests

# Esegue la suite di test dell'ecosistema aero su push, PR e su richiesta manuale.
# I test sono autonomi (nessun framework esterno): il runner è run_tests.py alla radice.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # avvio manuale dalla tab "Actions"

jobs:
  tests:
    name: Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Su Linux il runner headless ha bisogno delle librerie OpenGL/EGL per Qt offscreen
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # Il runner imposta QT_QPA_PLATFORM=offscreen automaticamente su Linux
        # e ritorna exit code non-zero se almeno un test fallisce.
        run: python run_tests.py
