[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-ui"
version = "0.3.0"
description = "Interfaccia grafica modulare per simulatore di volo"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    # NUOVE DIPENDENZE
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]